<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Ambient Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="450" x2="600" y2="450" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
  </g>

  <!-- Fitness Rings / Biometrics Gauge -->
  <circle cx="300" cy="270" r="140" fill="none" stroke="#334155" stroke-width="18" opacity="0.4" />
  <circle cx="300" cy="270" r="140" fill="none" stroke="url(#glowGrad)" stroke-width="18" stroke-dasharray="879" stroke-dashoffset="240" stroke-linecap="round" filter="url(#neonGlow)" />
  
  <circle cx="300" cy="270" r="105" fill="none" stroke="#334155" stroke-width="14" opacity="0.4" />
  <circle cx="300" cy="270" r="105" fill="none" stroke="#06b6d4" stroke-width="14" stroke-dasharray="660" stroke-dashoffset="180" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Center Pulse / Heartbeat Line -->
  <path d="M 210 270 L 250 270 L 270 230 L 290 310 L 315 240 L 335 285 L 350 270 L 390 270" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Calorie & Heart Rate Metrics Floating Pills -->
  <g transform="translate(180, 430)">
    <rect width="240" height="54" rx="27" fill="rgba(15, 23, 42, 0.85)" stroke="#f97316" stroke-width="2" filter="url(#neonGlow)" />
    <text x="120" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      🔥 842 KCAL • 154 BPM
    </text>
  </g>

  <!-- Energy Wave Flare -->
  <circle cx="300" cy="270" r="180" fill="none" stroke="#f97316" stroke-width="2" opacity="0.3" stroke-dasharray="10 15" />
</svg>
